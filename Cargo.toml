[package]
name = "pabs-crf"
version = "0.1.0"
edition = "2021"
authors = ["Academic Research Team"]
description = "Lattice-based Predicate Attribute-Based Signature with Cryptographic Reverse Firewall"
homepage = "https://github.com/KaezAnudorr/PABS-CRF"
repository = "https://github.com/KaezAnudorr/PABS-CRF"
license = "MIT"

[features]
default = []
avx512 = []

[dependencies]
rand = { version = "0.8", features = ["std_rng"] }
subtle = "2.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
tracing = "0.1"
cpufeatures = "0.2"

[dev-dependencies]
criterion = "0.4"
fips204 = "=0.4.6"
half = "=2.3.1"
rayon = "=1.7.0"
rayon-core = "=1.11.0"
# clap = "=4.4.0"
# clap_lex = "=1.0.1"
# rayon = "=1.10.0"
# rayon-core = "=1.12.0"

[[bench]]
name = "sign"
path = "benches/sign.rs"
harness = false

# [[bench]]
# name = "verify"
# path = "benches/verify.rs"
# harness = false

# [[bench]]
# name = "compare"
# path = "benches/compare.rs"
# harness = false

# [[bench]]
# name = "compression"
# path = "benches/compression.rs"
# harness = false

[[bench]]
name = "workload_benchmark"
path = "benches/workload_benchmark.rs"
harness = false

[[bench]]
name = "sigma_sweep_benchmark"
path = "benches/sigma_sweep_benchmark.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
